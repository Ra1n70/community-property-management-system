spring.application.name=community-property-management-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cpms}
spring.datasource.username=${DB_USER:cpms}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# The frontend signs people out after 60 minutes without activity; the server session lasts slightly longer.
server.servlet.session.timeout=65m
server.error.include-message=never
demo.manager-password=${DEMO_MANAGER_PASSWORD:}
demo.invite-code=${DEMO_INVITE_CODE:}


locker.pickup-code-secret=${PICKUP_CODE_SECRET}
locker.mail.from=${MAIL_FROM:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

amenity.upload-dir=${AMENITY_UPLOAD_DIR:./uploads/amenities}
amenity.seed=${AMENITY_SEED:false}
spring.servlet.multipart.max-file-size=5MB

# Up to three 5 MB maintenance photos plus request metadata.
spring.servlet.multipart.max-request-size=16MB
