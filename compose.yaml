services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cpms
      POSTGRES_USER: cpms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cpms-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpms -d cpms"]
      interval: 5s
      retries: 10
volumes:
  cpms-db:
